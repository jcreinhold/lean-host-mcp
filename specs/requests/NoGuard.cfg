\* The server holds no shared lock for a check, so another writer can build
\* between the check's setup-file and its worker's import load.
CONSTANTS
    Ids = {"a"}
    Intents = {"B", "C"}
    Builds = {"B"}
    MaxWorkers = 1
    MaxRuns = 1
    MaxCrashes = 0
    MaxExternal = 1
    Mode = "no_guard"
SPECIFICATION Spec
INVARIANTS TypeOK FreshImports
CHECK_DEADLOCK FALSE
