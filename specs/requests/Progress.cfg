\* Every request ends, under the fairness assumptions in FairSpec, with one
\* other writer.
CONSTANTS
    Ids = {"a", "b", "c"}
    Intents = {"B", "C"}
    Builds = {"B"}
    MaxWorkers = 1
    MaxRuns = 3
    MaxCrashes = 1
    MaxExternal = 1
    Mode = "good"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTY EveryRequestEnds
CHECK_DEADLOCK FALSE
