[package]
authors.workspace = true
description = "Helpers the lean-host-mcp integration test suites share"
edition.workspace = true
license.workspace = true
name = "lean-host-mcp-test-support"
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
lean-host-mcp = { path = "../lean-host-mcp" }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

[lints]
workspace = true
