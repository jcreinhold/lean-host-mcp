name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Enforces the lean-rs version-floor ban in deny.toml: a partial upgrade
      # that drags a pre-0.3 lean-rs copy back into the graph fails here with a
      # named diagnostic instead of as a deep E0308 in a consumer.
      - name: cargo deny check
        run: cargo deny --locked check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Rust from rust-toolchain.toml
        run: rustup show
      - name: Install the fixture Lean toolchain
        run: scripts/ci-setup-lean.sh
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lean-${{ hashFiles('fixtures/lean/lean-toolchain') }}
      - name: fmt
        run: cargo fmt --all -- --check
      # clippy --workspace is link-safe (no final link happens) per AGENTS.md.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # rustdoc per member: a broken or private intra-doc link ships to docs.rs
      # as dead text, so fail on it here.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked -p lean-host-mcp --no-deps
          cargo doc --locked -p lean-host-mcp-worker --no-deps
      # Build and test PER-MEMBER: selecting both members in one build
      # unifies the lean-rs-sys feature set across the parent and
      # worker, silently re-linking libleanshared into the parent (AGENTS.md
      # "Build and validation"). That also makes the parent's own test binary
      # unrunnable — it would reference @rpath/libleanshared.dylib with no rpath.
      - name: build (parent)
        run: cargo build --locked -p lean-host-mcp --all-targets
      - name: test (worker)
        run: cargo test --locked -p lean-host-mcp-worker --all-targets
      - name: Installed package proof and semantic search
        run: scripts/test-installed-module-setup.sh
      - name: test (parent)
        run: scripts/test-installed-stdio.sh --all-targets
      - name: Check the parent link set
        run: scripts/check-parent-link.sh

  # TLC on the request model and on the SDK custody model it assumes, at the
  # SDK version in Cargo.lock. A pass means no counterexample within the
  # bounds in specs/requests/*.cfg, not a proof about the running server.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find the locked SDK version
        id: sdk
        run: |
          python3 - >>"$GITHUB_OUTPUT" <<'PY'
          import tomllib
          [version] = {p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"]
                       if p["name"] == "lean-toolchain"}
          print(f"version={version}")
          PY
      - uses: actions/checkout@v6
        with:
          repository: jcreinhold/lean-rs
          ref: v${{ steps.sdk.outputs.version }}
          path: lean-rs
          persist-credentials: false
      - name: Fetch TLC
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: TLC
        run: |
          JAVA="$JAVA_HOME_21_X64/bin/java" TLA_TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" \
            python3 specs/requests/check.py --sdk lean-rs/specs/worker-custody
