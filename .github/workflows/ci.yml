name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Enforces the lean-rs version-floor ban in deny.toml: a partial upgrade
      # that drags a pre-0.3 lean-rs copy back into the graph fails here with a
      # named diagnostic instead of as a deep E0308 in a consumer.
      - name: cargo deny check
        run: cargo deny --locked check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Rust from rust-toolchain.toml
        run: rustup show
      - name: Install the fixture Lean toolchain
        run: scripts/ci-setup-lean.sh
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lean-${{ hashFiles('fixtures/lean/lean-toolchain') }}
      - name: fmt
        run: cargo fmt --all -- --check
      # clippy --workspace is link-safe (no final link happens) per AGENTS.md.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # rustdoc per member: a broken or private intra-doc link ships to docs.rs
      # as dead text, so fail on it here.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked -p lean-host-mcp --no-deps
          cargo doc --locked -p lean-host-mcp-worker --no-deps
      # Build and test PER-MEMBER: selecting both members in one build
      # unifies the lean-rs-sys feature set across the parent and
      # worker, silently re-linking libleanshared into the parent (AGENTS.md
      # "Build and validation"). That also makes the parent's own test binary
      # unrunnable — it would reference @rpath/libleanshared.dylib with no rpath.
      - name: build (parent)
        run: cargo build --locked -p lean-host-mcp --all-targets
      - name: test (worker)
        run: cargo test --locked -p lean-host-mcp-worker --all-targets
      - name: Installed package proof and semantic search
        run: scripts/test-installed-module-setup.sh
      - name: test (parent)
        run: scripts/test-installed-stdio.sh --all-targets
      - name: Check the parent link set
        run: scripts/check-parent-link.sh
