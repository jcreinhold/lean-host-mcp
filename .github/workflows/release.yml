name: Release

# Tag-triggered release. Pushing a `v<semver>` tag (e.g. `v0.1.0`, `v0.1.1-rc.1`)
# runs the full gate (`verify`), then publishes both crates to crates.io and
# creates a GitHub Release whose body is the matching `## [<version>]` section of
# `CHANGELOG.md` (`publish`, depends on `verify`).
#
# Manual runs rehearse verification and packaging. To recover a partial
# release, rerun the original tagged workflow. It skips crate versions that
# are already on crates.io.
#
# `CARGO_REGISTRY_TOKEN` must be set in the repository secrets before the first
# tag push — a scoped publish token from <https://crates.io/settings/tokens>.
#
# Verify builds the checkout members separately and tests the packaged pair.
# Publish needs the verification result and runs without a Lean toolchain.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  # Keep rehearsals separate from tagged releases and let an active release finish.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Rust from rust-toolchain.toml
        run: rustup show

      - name: Validate release version and changelog
        id: release
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          import uuid

          with pathlib.Path("Cargo.toml").open("rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          # Release dependencies must resolve from the sources users receive.
          if manifest.get("patch"):
              raise SystemExit("Release blocked: publish upstream fixes and remove Cargo.toml patches first")
          version = manifest["workspace"]["package"]["version"]
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1",
          ]))
          versions = {package["name"]: package["version"] for package in metadata["packages"]}
          for name in ("lean-host-mcp", "lean-host-mcp-worker"):
              if versions.get(name) != version:
                  raise SystemExit(f"{name} must use workspace version {version}")
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              expected_ref = f"refs/tags/v{version}"
              ref = os.environ["GITHUB_REF"]
              if ref != expected_ref:
                  raise SystemExit(f"Release ref {ref} does not match workspace version {version} ({expected_ref})")

          heading = f"## [{version}]"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          body = []
          found = False
          for line in lines:
              if found and line.startswith("## "):
                  break
              if found:
                  body.append(line)
              elif line == heading or line.startswith(f"{heading} "):
                  found = True
          notes = "\n".join(body)
          if not notes.strip():
              raise SystemExit(f"CHANGELOG.md needs a nonblank [{version}] section")

          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"package_dir={pathlib.Path(metadata['target_directory']) / 'package'}", file=output)
              print(f"notes<<{delimiter}\n{notes}\n{delimiter}", file=output)
          PYTHON

      - name: Install fixture Lean toolchain
        run: scripts/ci-setup-lean.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('fixtures/lean/lean-toolchain') }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny --locked check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # clippy --workspace is link-safe (no final link happens) per AGENTS.md.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # rustdoc per member: a broken or private intra-doc link ships to docs.rs
      # as dead text, so fail on it here.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked -p lean-host-mcp --no-deps
          cargo doc --locked -p lean-host-mcp-worker --no-deps

      # Build and test PER-MEMBER: selecting both members in one build
      # unifies the lean-rs-sys feature set across the parent and
      # worker, silently re-linking libleanshared into the parent.
      - name: build (parent)
        run: cargo build --locked -p lean-host-mcp --all-targets

      - name: test (worker)
        run: cargo test --locked -p lean-host-mcp-worker --all-targets

      - name: test (parent)
        run: scripts/test-installed-stdio.sh --all-targets

      - name: Check parent linkage
        run: scripts/check-parent-link.sh

      # This also runs `cargo package --workspace --locked` to verify both archives.
      - name: Test packaged proof and semantic search
        run: scripts/test-installed-module-setup.sh

      - name: Check packaged installer inputs
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import tarfile

          archives = pathlib.Path(os.environ["PACKAGE_DIR"])
          version = os.environ["RELEASE_VERSION"]
          inputs = {"lean-host-mcp": "README.md", "lean-host-mcp-worker": "Cargo.lock"}
          for name, required in inputs.items():
              stem = f"{name}-{version}"
              with tarfile.open(archives / f"{stem}.crate", "r:gz") as archive:
                  if not archive.getmember(f"{stem}/{required}").isfile():
                      raise SystemExit(f"{stem}: expected packaged file {required}")
          PYTHON

  publish:
    name: Publish
    permissions:
      contents: write # Create the GitHub Release after publication.
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Rust from rust-toolchain.toml
        run: rustup show

      - name: Require verified release information
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          if [[ -z "$RELEASE_VERSION" || -z "$RELEASE_NOTES" ]]; then
            echo "::error::Verify did not provide the version and release notes."
            exit 1
          fi

      - name: Publish to crates.io (worker first, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured."
            exit 1
          fi
          publish_one() {
            local crate="$1" status
            # crates.io returns 200 for an existing version, 404 otherwise. A
            # User-Agent is required or the API returns 403.
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              -H "User-Agent: lean-host-mcp-release (github.com/jcreinhold/lean-host-mcp)" \
              "https://crates.io/api/v1/crates/$crate/$RELEASE_VERSION")
            case "$status" in
              200) echo "$crate@$RELEASE_VERSION already published"; return 0 ;;
              404) ;;
              *) echo "::error::Could not check $crate@$RELEASE_VERSION (HTTP $status)"; return 1 ;;
            esac
            echo "Publishing $crate@$RELEASE_VERSION"
            cargo publish --locked --no-verify --registry crates-io -p "$crate"
          }
          # The parent installs the worker at its own exact version. Cargo
          # repackages both crates here. The Verify job builds the packages with Lean.
          publish_one lean-host-mcp-worker
          publish_one lean-host-mcp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.verify.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
