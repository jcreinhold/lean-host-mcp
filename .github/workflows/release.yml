name: Release

# Tag-triggered release. Pushing a `v<semver>` tag (e.g. `v0.1.0`, `v0.1.1-rc.1`)
# runs the full gate (`verify`), then publishes both crates to crates.io and
# creates a GitHub Release whose body is the matching `## [<version>]` section of
# `CHANGELOG.md` (`publish`, depends on `verify`).
#
# Manual re-runs use `workflow_dispatch` with `dry_run: true` to exercise the
# gates and packaging without uploading or creating a release. A live re-run
# (dry_run: false) is idempotent: each crate is skipped if its version is
# already on crates.io, so a partial release can be completed without burning a
# version (crates.io versions are immutable).
#
# `CARGO_REGISTRY_TOKEN` must be set in the repository secrets before the first
# tag push — a scoped publish token from <https://crates.io/settings/tokens>.
#
# Verify builds the checkout members separately, then packages the workspace
# together so Cargo verifies each archive with access to its packaged siblings.
# Publish reuses that gate and needs neither Lean nor a token for a rehearsal.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all gates but skip the crates.io publish and GitHub Release."
        type: boolean
        default: false

concurrency:
  # One release at a time per tag. `cancel-in-progress: false`: a half-finished
  # publish that gets cancelled mid-run wastes a published crate version
  # (crates.io versions are immutable).
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Development may patch an unpublished worker fix, but a release must
      # resolve the same published sources that downstream users receive.
      - name: Reject unpublished dependency patches
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if manifest.get("patch"):
              raise SystemExit("Release blocked: publish upstream fixes and remove Cargo.toml patches first")
          PYTHON

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install elan + supported Lean toolchain
        run: |
          set -euo pipefail
          # A real, supported Lean toolchain is mandatory to build/test the
          # worker (lean-rs-sys's build.rs hashes lean.h and fails unless it
          # matches SUPPORTED_TOOLCHAINS). Track the fixture's pin so the gate
          # follows the supported head automatically.
          toolchain="$(cat fixtures/lean/lean-toolchain)"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          prefix="$("$HOME/.elan/bin/elan" run --install "$toolchain" lean --print-prefix)"
          [[ "$prefix" = /* ]]
          test -f "$prefix/include/lean/lean.h"
          test -f "$prefix/lib/lean/libleanshared.so"
          echo "LEAN_SYSROOT=$prefix" >> "$GITHUB_ENV"

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-host-mcp"))')"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match workspace version $version (expected $expected). Bump Cargo.toml or re-tag."
            exit 1
          fi
          echo "Tag $tag matches workspace version $version"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # clippy --workspace is link-safe (no final link happens) per AGENTS.md.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # rustdoc per member: a broken or private intra-doc link ships to docs.rs
      # as dead text, so fail on it here.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p lean-host-mcp --no-deps
          cargo doc -p lean-host-mcp-worker --no-deps

      # Build and test PER-MEMBER: selecting both members in one build
      # unifies the lean-rs-sys feature set across the parent and
      # worker, silently re-linking libleanshared into the parent.
      - name: build (parent)
        run: cargo build -p lean-host-mcp --all-targets

      - name: build (worker)
        run: cargo build -p lean-host-mcp-worker --all-targets

      - name: test (parent)
        run: scripts/test-installed-stdio.sh --all-targets

      - name: parent ⊥ libleanshared
        run: |
          set -euo pipefail
          cargo build --release -p lean-host-mcp
          if ldd target/release/lean-host-mcp | grep -q libleanshared; then
            echo "FAIL: parent links libleanshared" >&2
            exit 1
          fi

      - name: Verify workspace packages and installer inputs
        run: |
          set -euo pipefail
          cargo package --workspace --locked
          python3 - <<'PYTHON'
          import json
          import pathlib
          import subprocess
          import tarfile

          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))
          archives = pathlib.Path(metadata["target_directory"]) / "package"
          inputs = {"lean-host-mcp": "README.md", "lean-host-mcp-worker": "Cargo.lock"}
          for name, required in inputs.items():
              package = next(p for p in metadata["packages"] if p["name"] == name)
              stem = f"{name}-{package['version']}"
              with tarfile.open(archives / f"{stem}.crate", "r:gz") as archive:
                  if not archive.getmember(f"{stem}/{required}").isfile():
                      raise SystemExit(f"{stem}: expected packaged file {required}")
          PYTHON

  publish:
    name: Publish
    permissions:
      contents: write # Create the GitHub Release after publication.
    needs: verify
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve workspace version
        id: ver
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-host-mcp"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io (worker first, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured."
            exit 1
          fi
          publish_one() {
            crate="$1"; shift
            # crates.io returns 200 for an existing version, 404 otherwise. A
            # User-Agent is required or the API returns 403.
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "User-Agent: lean-host-mcp-release (github.com/jcreinhold/lean-host-mcp)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate@$version already published"; return 0 ;;
              404) ;;
              *) echo "::error::Could not check $crate@$version (HTTP $status)"; return 1 ;;
            esac
            echo "→ publishing $crate@$version"
            cargo publish --locked -p "$crate" "$@"
          }
          # Worker first: a user must never install a parent whose install-worker
          # resolves a not-yet-published worker. Both publish with --no-verify:
          # the verify build pulls lean-rs-sys (and, for the worker, links
          # libleanshared), which demands a Lean toolchain this Lean-free job
          # does not have. The `verify` gate built both members, tested the parent,
          # verified both packaged crates with their installer inputs.
          publish_one lean-host-mcp-worker --no-verify
          publish_one lean-host-mcp --no-verify

      - name: Extract CHANGELOG section for this release
        if: inputs.dry_run != true && github.event_name == 'push'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG section for [$version]; add one before tagging."
            exit 1
          fi
          echo "--- Release body ---"
          cat release-body.md
          echo "--- End release body ---"

      - name: Create GitHub Release
        if: inputs.dry_run != true && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
